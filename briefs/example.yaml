# ─── Content section ──────────────────────────────────────────────────────────
content:
  image_url: "https://www.kurabiotech.com/hubfs/blikka_destello.png"
  image_alt: "Blikka Genomics TdT Enzyme"
  paragraphs:
    - >
      Controlled DNA and RNA enzymatic synthesis is an advanced technique that
      allows for the precise creation of sequences by using specific enzymes
      to add nucleotides under monitored conditions,
      ensuring control over the length and composition of the sequence.
    - >
      One of the enzymes for enzymatic DNA synthesis is Terminal deoxynucleotidyl
      transferase (TdT). This enzyme has proven to be a reliable tool for synthesizing
      DNA without a template. TdT enzymes add nucleotides to the 3' end of a DNA
      molecule, enabling the construction of custom DNA/RNA driving advanced
      applications.
    - >
      Commercially available TdT enzymes are not optimized for non-native nucleotide
      analogs required for the controlled synthesis.
      <a href="https://www.kurabiotech.com/blikka-genomics">Blikka Genomics</a>
      offers a diverse portfolio of six proprietary
      <a href="https://www.kurabiotech.com/blikka-genomics/tdt-enzymes">Terminal
      Deoxynucleotidyl Transferase (TdT) enzymes</a> derived from artificial
      chimeric origins and designed for high coupling efficiency with both natural
      and modified nucleotides.
  cta:
    label: "Learn more about TdT"
    url: "/blikka-genomics/tdt-enzymes"

# ─── Performance data section (optional — remove block to hide) ───────────────
data_section:
  title: "Performance Data"
  items:
    - title: "Incorporation of DNA Natural Nucleotides"
      image_url: "https://www.kurabiotech.com/hubfs/tdt_dna_natural.png"
      caption: >
        Addition of natural deoxyribonucleotides. Enzymes were incubated with
        a 1:10 oligo:dNTP ratio for 1 minute at 37°C.
    - title: "Incorporation of DNA-Modified Nucleotides"
      image_url: "https://www.kurabiotech.com/hubfs/tdt_dna_modified.png"
      caption: >
        Addition of modified nucleotides. Enzymes were incubated with a 1:10
        oligo:dNTP ratio for 30 minutes at 37°C. Bovine TdT shown as reference.
    - title: "Incorporation of RNA Natural Nucleotides"
      image_url: "https://www.kurabiotech.com/hubfs/tdt_rna_natural.png"
      caption: >
        Addition of natural ribonucleotides. Enzymes were incubated with a 1:10
        oligo:dNTP ratio for 30 minutes at 37°C.

